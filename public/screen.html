<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pantalla Pública de Votación</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="screen.css" />
</head>
<body class="screen-body">
  <div class="aurora" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

  <div class="screen-shell">
    <header class="screen-top">
      <div class="top-brand">
        <div class="live"><span class="live-dot"></span>EN VIVO</div>
        <p class="eyebrow">Concejo Deliberante · <span id="screenSessionType">Sesión</span> · <span id="screenSessionDate">—</span></p>
        <h1 id="screenProjectTag">Cargando proyecto…</h1>
      </div>
      <div class="top-metrics">
        <div class="metric verde" id="chipPresentes">
          <strong id="screenPresent">0</strong>
          <span>presentes de <em id="screenTotal">0</em></span>
        </div>
        <div class="metric" id="chipQuorum">
          <strong id="screenQuorumState">—</strong>
          <span>quórum de <em id="screenQuorumRequired">0</em></span>
        </div>
        <div class="metric reloj">
          <strong id="screenClock">--:--:--</strong>
          <span>hora del servidor <em id="screenServerAt">—</em></span>
        </div>
      </div>
    </header>

    <div class="alerta" id="screenAlert" hidden></div>

    <section class="screen-hero">
      <div class="hero-main">
        <div class="pills">
          <span class="pill estado" id="screenStatus">Votación abierta</span>
          <span class="pill" id="screenStartedAt">—</span>
          <span class="pill tipo" id="screenType">—</span>
        </div>
        <h2 id="screenTitle">—</h2>
        <p id="screenDescription">—</p>
        <div class="result-banner" id="resultBanner">
          <span class="result-flag" id="screenResult">—</span>
          <span class="result-note" id="resultNote">—</span>
        </div>
      </div>
      <aside class="hero-donut">
        <div class="donut" id="voteDonut">
          <div class="donut-hole">
            <strong id="donutTotal">0</strong>
            <span>votos emitidos</span>
            <em id="donutPart">0% del cuerpo</em>
          </div>
        </div>
        <ul class="leyenda" id="donutLegend"></ul>
      </aside>
    </section>

    <section class="screen-votes" id="voteCards"></section>

    <section class="screen-presence">
      <header class="presence-head">
        <div class="presence-titulo">
          <h3>Presencia en sesión</h3>
          <div class="presence-bar"><i id="presenceFill"></i></div>
          <span class="presence-detalle" id="presenceDetalle">—</span>
        </div>
        <div class="voton-global" id="presenceBig">
          <span class="voton-punto"></span>
          <strong id="presenceBigText">0 presentes</strong>
          <em id="presenceBigSub">sesión sin actividad</em>
        </div>
      </header>
      <div class="councillor-grid" id="councillorList"></div>
    </section>
  </div>

  <script src="screen.js"></script>
</body>
</html>
